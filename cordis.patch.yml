# dsh-plugin-skill-autoroute bundle patch.
#
# One Host row named after the package. The row registers an `agent/pre-step`
# listener that appends exactly one routing notice to the first step of every
# received user instruction, plus a `skills/change` listener that invalidates
# the catalog cache. No client half: the notice rides the normal conversation
# transcript, so there is nothing to draw in the layout.
#
# Optional profile-level config (a later patch layer wins):
#   - id: dsh-plugin-skill-autoroute
#     config:
#       mode: brief          # off | brief | load | router
#       routerSkills: ['skill-selector', 'skill-router']
#       candidates: 3        # how many candidates the notice lists (1-25)
#       catalogLimit: 400    # how many skills one pass may scan (1-20000)
#       explain: true        # false drops the matched-token lines
#       minScore: 0.28
#       loadMinScore: 0.55
#       locale: zh
- insert:
    - id: dsh-plugin-skill-autoroute
      name: 'dsh-plugin-skill-autoroute'
